<div class="container py-4">
  <div class="mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h2 class="fw-bold mb-1 text-dark">
        <i class="bi bi-file-earmark-plus text-primary me-2"></i> Apertura de Ficha Clínica
      </h2>
      <p class="text-muted mb-0">
        Registro digital unificado de paciente y responsable legal para control veterinario.
      </p>
    </div>
    <div>
      <a routerLink="/mascotas/historial" class="btn btn-outline-primary rounded-pill px-4 fw-semibold">
        <i class="bi bi-folder2-open me-2"></i> Ver Pacientes Registrados
      </a>
    </div>
  </div>

  <app-formulario-mascota
    [duenosExistentes]="duenosExistentes"
    [enviando]="enviando"
    (guardarRegistro)="procesarGuardado($event)"
    (cancelar)="cancelar()"
  ></app-formulario-mascota>
</div>
