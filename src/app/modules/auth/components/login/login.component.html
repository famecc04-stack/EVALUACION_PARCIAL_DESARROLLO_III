<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-primary text-white text-center py-4">
            <div class="mb-2">
              <i class="bi bi-hospital fs-1"></i>
            </div>
            <h3 class="fw-bold mb-1">VETCLINIC PRO</h3>
            <p class="mb-0 text-white-50 small">Sistema Integral de Gestión y Atención Veterinaria</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <h5 class="fw-bold text-secondary mb-4 text-center">Acceso al Sistema</h5>

            <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()" novalidate>
              <div class="mb-3">
                <label for="correo" class="form-label fw-semibold small text-muted">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-envelope text-primary"></i>
                  </span>
                  <input
                    type="email"
                    id="correo"
                    formControlName="correo"
                    class="form-control border-start-0"
                    placeholder="ejemplo@veterinaria.com"
                    [class.is-invalid]="formularioLogin.get('correo')?.invalid && formularioLogin.get('correo')?.touched"
                  />
                </div>
                <div
                  *ngIf="formularioLogin.get('correo')?.invalid && formularioLogin.get('correo')?.touched"
                  class="text-danger small mt-1"
                >
                  <span *ngIf="formularioLogin.get('correo')?.errors?.['required']">El correo es obligatorio.</span>
                  <span *ngIf="formularioLogin.get('correo')?.errors?.['email']">Ingrese un formato de correo válido.</span>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-muted">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-lock text-primary"></i>
                  </span>
                  <input
                    type="password"
                    id="password"
                    formControlName="password"
                    class="form-control border-start-0"
                    placeholder="••••••••"
                    [class.is-invalid]="formularioLogin.get('password')?.invalid && formularioLogin.get('password')?.touched"
                  />
                </div>
                <div
                  *ngIf="formularioLogin.get('password')?.invalid && formularioLogin.get('password')?.touched"
                  class="text-danger small mt-1"
                >
                  <span *ngIf="formularioLogin.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
                  <span *ngIf="formularioLogin.get('password')?.errors?.['minlength']">Mínimo 6 caracteres requeridos.</span>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-2 fw-semibold rounded-3 d-flex align-items-center justify-content-center gap-2 shadow-sm"
                [disabled]="cargando"
              >
                <span *ngIf="cargando" class="spinner-border spinner-border-sm" role="status"></span>
                <i *ngIf="!cargando" class="bi bi-box-arrow-in-right"></i>
                <span>Ingresar al Portal</span>
              </button>
            </form>

            <div class="mt-4 pt-3 border-top">
              <span class="small text-muted d-block mb-2 text-center">Usuarios de demostración (cada rol ve una pantalla distinta):</span>
              <div class="list-group list-group-flush small">
                <button type="button" class="list-group-item list-group-item-action" (click)="seleccionarRolDemo('recepcion@veterinaria.com')">
                  <i class="bi bi-calendar-check text-primary me-2"></i><strong>Recepción</strong>
                  <span class="text-muted d-block ms-4">Agenda de todos los médicos, agendar/cancelar citas y registrar pacientes. Sin acceso a historial clínico.</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action" (click)="seleccionarRolDemo('amorales@veterinaria.com')">
                  <i class="bi bi-person-badge text-primary me-2"></i><strong>Veterinario</strong> (Dr. Morales)
                  <span class="text-muted d-block ms-4">Solo su agenda; inicia/finaliza atenciones y registra en el historial clínico.</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action" (click)="seleccionarRolDemo('mcastillo@veterinaria.com')">
                  <i class="bi bi-person-badge text-primary me-2"></i><strong>Veterinaria</strong> (Dra. Castillo)
                  <span class="text-muted d-block ms-4">Igual que el anterior, con su propia agenda.</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action" (click)="seleccionarRolDemo('admin@veterinaria.com')">
                  <i class="bi bi-shield-lock text-primary me-2"></i><strong>Administrador</strong>
                  <span class="text-muted d-block ms-4">Supervisión total: agenda, pacientes, historial (solo lectura) e ingresos estimados.</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
